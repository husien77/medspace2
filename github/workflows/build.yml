name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unpack project
        run: unzip -q MedSpace-part1.zip -d work
      - name: Download font
        working-directory: work/MedSpace
        run: |
          mkdir -p app/src/main/res/font
          for w in Regular Medium Bold; do
            l=$(echo "$w" | tr 'A-Z' 'a-z')
            curl -fL -o "app/src/main/res/font/tajawal_$l.ttf" "https://github.com/google/fonts/raw/main/ofl/tajawal/Tajawal-$w.ttf"
          done
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        working-directory: work/MedSpace
        run: gradle assembleDebug --no-daemon
      - name: Rename
        run: cp work/MedSpace/app/build/outputs/apk/debug/app-debug.apk MEDSPACE.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MEDSPACE build ${{ github.run_number }}
          files: MEDSPACE.apk
          make_latest: true
